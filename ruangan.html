<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CarlLab — Pencet Monitornya, Kamera Mendekat</title>
<meta name="description" content="Ruangan foto realistis CarlLab dengan tiga monitor. Pencet satu monitor: kamera meluncur mendekat dan identitas grupnya tampil di dalam layar itu — kiri Brand & Logo, tengah Websites, kanan Video Editing.">
<link rel="stylesheet" href="ruangan.css?v=104">
</head>
<body>

<nav aria-label="Navigasi utama">
  <span class="brand">Carl<b>Lab</b></span>
  <a class="nl" href="#ruangan">Ruangan</a>
  <button class="langbtn" id="langBtn" type="button" aria-label="Ganti bahasa / Switch language">EN</button>
  <a class="cta" href="#pesan"><i></i>Pesan</a>
</nav>

<main>
  <!-- ================= PANGGUNG ================= -->
  <section class="stage-sec" id="ruangan">
    <div class="stage" id="stage">
      <div class="cam" id="cam">
        <div class="breath">
        <img id="room" src="room-nyala-l.jpg" alt="Foto ruangan gaming CarlLab dengan tiga monitor menyala" width="1920" height="1280">
        <img id="roomP" src="room-nyala-p.jpg" alt="" aria-hidden="true" width="1184" height="2096">

        <!-- MONITOR KIRI — BRAND & LOGO (zona pencet tak terlihat: diam = foto bersih) -->
        <div class="scr scr-l">
          <button class="zone" type="button" data-open="brand" aria-label="Buka grup Brand dan Logo di monitor kiri"></button>
        </div>

        <!-- MONITOR TENGAH — WEBSITES (zona pencet tak terlihat) -->
        <div class="scr scr-c">
          <button class="zone" type="button" data-open="web" aria-label="Buka grup Websites di monitor tengah"></button>
        </div>

        <!-- MONITOR KANAN — VIDEO EDITING (zona pencet tak terlihat) -->
        <div class="scr scr-r">
          <button class="zone" type="button" data-open="video" aria-label="Buka grup Video Editing di monitor kanan"></button>
        </div>

        <!-- VEIL: peredup fokus di dalam bingkai foto (pengganti scrim;
             ikut skala foto, tidak menghalangi klik display) -->
        <div class="veil" aria-hidden="true"></div>

        <!-- HUB: teks display di dalam layar monitor yang dipencet.
             Anak .breath: posisi/ukuran dalam % foto (quad display,
             inset 1.5%), pose rotateY sama seperti layar di foto. -->
        <!-- NYALA v7: monitor sudah menyala DI FOTONYA SENDIRI —
             foto dasar digambar ulang dengan ketiga monitor menyala
             wallpaper Bloom menyambung (satu sumber, tanpa lapisan
             layar tempelan). Zona pencet + hub dive memakai quad
             yang sama seperti sebelumnya. -->

        <div class="hub" id="hub" role="dialog" aria-label="Identitas grup di dalam monitor" hidden></div>
        </div>
      </div>

      <!-- TAKEOVER LIVE (v3w): lapisan di atas SELURUH panggung (saudara
           .cam, BUKAN anak .breath/.cam) — iframe situs live LUMÉRA +
           chip kembali melayang dirender JS ke sini saat view "live"
           dibuka. inset:0 terhadap .stage = viewport panggung penuh:
           di HP panggung memang 100vw x 100dvh, jadi situs asli tampil
           persis seperti dibuka layar penuh. Kosong + hidden saat diam. -->
      <div class="takeover" id="takeover" hidden></div>
    </div>

    <p class="stage-hint">Pencet salah satu monitornya — kamera akan mendekat.</p>

  </section>

</main>

<script src="ruangan.js?v=104"></script>
</body>
</html>
